<main>
    <article class="card">
        <section id="p4a-frame-select">
            <h2>Step 1: Choose the color of the frame</h2>
            <div class="flex-row around">
                <img src="p4a/aqua.png" id="aqua" class="p4a-pfp-overlay"/>
                <img src="p4a/green.png" id="green" class="p4a-pfp-overlay"/>
                <img src="p4a/navy.png" id="navy" class="p4a-pfp-overlay"/>
                <img src="p4a/orange.png" id="orange" class="p4a-pfp-overlay"/>
            </div>
        </section>
        <section id="pfa-image-upload" class="hide">
            <h2>Step 2: Select an image</h2>
            <label for="upload" class="custom-file-upload">
                Choose Image
            </label>
            <input type="file" id="upload" accept="image/*">
        </section>
        <section id="p4a-show-and-download-section" class="hide">
            <h2>Step 3: Download!</h2>
            <div class="flex-row around">
                <canvas id="p4a-canvas"></canvas>
                <button id="download">Download</button>
            </div>

        </section>
    </article>
    <article class="card">
        <h2>Stay connected with the Project 4 Awesome</h2>
        <p>P4A February 12-14</p>
        <ul>
            <li><a href="https://projectforawesome.com/" target="_blank">P4A Website</a></li>
            <li><a href="https://bsky.app/profile/projectforawesome.com" target="_blank">P4A Bluesky</a></li>
            <li><a href="https://www.instagram.com/projectforawesome/" target="_blank">P4A Instagram</a></li>
            <li><a href="https://www.youtube.com/user/project4awesome" target="_blank">P4A Youtube</a></li>
        </ul>
    </article>
</main>
